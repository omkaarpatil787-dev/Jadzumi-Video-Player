name: Build Jadzumi APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Accept Licenses & Install Android 36
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0"

    - name: Fix Windows Line Endings & Permissions
      run: |
        sed -i 's/\r$//' gradlew
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Save APK for Download
      uses: actions/upload-artifact@v4
      with:
        name: Jadzumi-Video-Build-4-debug
        path: app/build/outputs/apk/debug/*.apk
