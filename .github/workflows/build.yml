name: Build Jadzumi APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Accept Licenses & Install Android 36
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0"

    - name: Fix Windows Line Endings & Permissions
      run: |
        sed -i 's/\r$//' gradlew
        chmod +x gradlew

    - name: Run Unit Tests & Build APKs
      run: ./gradlew test assembleRelease assembleDebug --no-daemon --stacktrace

    - name: Save Release APK (v1.0.0 Optimized & Shrunk)
      uses: actions/upload-artifact@v4
      with:
        name: Jadzumi-Video-v1.0.0-Release
        path: app/build/outputs/apk/release/*.apk

    - name: Save Debug APK (v1.0.0)
      uses: actions/upload-artifact@v4
      with:
        name: Jadzumi-Video-v1.0.0-Debug
        path: app/build/outputs/apk/debug/*.apk
