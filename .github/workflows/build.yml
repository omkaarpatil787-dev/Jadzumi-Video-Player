name: Build Jadzumi APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
    - name: Configure temporary signing path
      run: echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/jadzumi-release.jks" >> "$GITHUB_ENV"

    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    - name: Install Android SDK packages
      shell: bash
      run: |
        set -euo pipefail
        # sdkmanager closes stdin after the last license; preserve its status, not yes's SIGPIPE.
        set +o pipefail
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
        sdk_status=${PIPESTATUS[1]}
        set -o pipefail
        test "$sdk_status" -eq 0
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

    - name: Read app version
      run: |
        VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
        test -n "$VERSION"
        echo "APP_VERSION=v$VERSION" >> "$GITHUB_ENV"

    - name: Prepare release signing
      id: signing
      shell: bash
      run: |
        set -euo pipefail
        if [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          echo "ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "Release signing secrets are incomplete; building tests and debug APK only."
          echo "ready=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Run unit tests and build debug APK
      run: bash gradlew test assembleDebug lintDebug --no-daemon --stacktrace

    - name: Build signed release APK
      if: steps.signing.outputs.ready == 'true'
      run: bash gradlew assembleRelease --no-daemon --stacktrace

    - name: Save debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Jadzumi-Video-${{ env.APP_VERSION }}-Debug
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error

    - name: Save signed release APK
      if: steps.signing.outputs.ready == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Jadzumi-Video-${{ env.APP_VERSION }}-Release
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error

    - name: Prepare named release APK
      if: github.ref == 'refs/heads/main' && steps.signing.outputs.ready == 'true'
      run: cp app/build/outputs/apk/release/*.apk "Jadzumi-Player-${APP_VERSION}.apk"

    - name: Update GitHub Release
      if: github.ref == 'refs/heads/main' && steps.signing.outputs.ready == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.APP_VERSION }}
        name: ${{ env.APP_VERSION }}
        files: Jadzumi-Player-${{ env.APP_VERSION }}.apk
        target_commitish: ${{ github.sha }}
        generate_release_notes: false
        body_path: RELEASE_NOTES.md
        prerelease: false
        make_latest: true
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Remove temporary release keystore
      if: always()
      run: rm -f "$ANDROID_KEYSTORE_FILE"
